name: Content freshness

# Keeps the playbook from ageing quietly between annual Nasscom-Zinnov releases.
# Runs the link-health sweep (needs outbound network, which CI has) plus the
# citation consistency check, publishes both reports as artifacts, and opens or
# updates a single tracking issue when links are genuinely broken.
on:
  schedule:
    # 06:00 UTC on the 1st of Jan / Apr / Jul / Oct — quarterly.
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the run if any link is broken'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Link health and citation sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Citation consistency check
        run: npm run check:citations

      - name: Resource link health
        id: links
        run: |
          npm run check:links ${{ inputs.strict && '-- --strict' || '' }}
          {
            echo 'report<<REPORT_EOF'
            cat reports/link-health.md
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "broken=$(node -e "process.stdout.write(String(require('./reports/link-health.json').counts.broken))")" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-reports
          path: reports/
          if-no-files-found: warn

      # One rolling issue rather than a new one every quarter, so the history of
      # a persistently dead link stays in a single thread.
      - name: Open or update the link-health issue
        if: steps.links.outputs.broken != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.links.outputs.report }}
          BROKEN: ${{ steps.links.outputs.broken }}
        with:
          script: |
            const title = 'Link health: broken resource links need attention';
            const body = [
              `**${process.env.BROKEN}** resource link(s) returned 404/410 in the latest sweep.`,
              '',
              process.env.REPORT,
              '',
              `_Generated by the Content freshness workflow — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-health',
              per_page: 10,
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.info(`Commented on existing issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-health'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Summary
        if: always()
        run: cat reports/link-health.md >> "$GITHUB_STEP_SUMMARY" || true
