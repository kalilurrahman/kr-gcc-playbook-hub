name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, citations, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Back to strict, reproducible installs: the committed package-lock.json
        # has been regenerated and is now in sync with package.json, so `npm ci`
        # succeeds again. If this ever fails with "Missing … from lock file",
        # the lockfile has drifted — regenerate it (see MAINTENANCE.md §2)
        # rather than loosening this step.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Citation consistency check
        run: npm run check:citations

      - name: Upload citation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-report
          path: reports/
          if-no-files-found: warn

      - name: Build
        run: npm run build
